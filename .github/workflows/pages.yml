# Publishes the hand-written landing page in site/ to GitHub Pages.
#
# The page has no build step, so the only work here is staging: site/ plus the repo
# assets it references, laid out the same way they sit in the repo. Nothing is
# generated, and nothing outside site/ + assets/ is deployed.

name: Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Stage site
        run: |
          mkdir -p _site/assets/screenshots
          cp site/index.html site/styles.css _site/
          cp assets/vocca-app-icon.png _site/assets/
          cp assets/screenshots/apps.png _site/assets/screenshots/
          cp assets/screenshots/cleanup.png _site/assets/screenshots/
          cp assets/screenshots/general.png _site/assets/screenshots/

      - uses: actions/configure-pages@v6
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
