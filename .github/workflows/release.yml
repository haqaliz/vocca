# Vocca Release
#
# Builds, signs, and publishes a GitHub Release when a v* tag is pushed — the deck-app
# shape, adapted to Vocca's own signing scripts: xcodebuild builds the Release bundle,
# then Scripts/sign.sh re-signs it with the imported identity and verifies the
# entitlement set on the finished signature.
#
# Secrets required (set in repo Settings → Secrets and variables → Actions), the same
# pair deck uses:
#   APPLE_CERT_P12_BASE64        base64 of an exported "Apple Development" .p12
#   APPLE_CERT_PASSWORD          password of that .p12
#
# Without the secrets a tag push still runs the whole suite as a gate and then FAILS
# loudly at the signing step. A tag run that ends green must have produced a release:
# a silently-skipped package is how a founder learns the "release" they announced does
# not exist, so there is no skip path.
#
# Notarization is deliberately NOT part of this workflow. Scripts/notarize.sh has never
# run end to end (it needs a paid Developer ID Application certificate and a notarytool
# credential, neither of which exists), so a release from here is signed — hardened
# runtime, secure timestamp, Apple Development identity — but not notarized.
#
# What that does and does not cost, measured on the published v0.1.0 rather than assumed:
# the bundle carries NO provisioning profile and its only entitlement is
# com.apple.security.device.audio-input, which Apple does not gate — so there is no device
# restriction and the app is not locked to the machine that signed it. Gatekeeper is the
# sole obstacle, and `xattr -dr com.apple.quarantine` clears it. Earlier notes here and in
# the v0.1.0 release claimed the build "runs only on machines that signed it"; that was
# wrong, and wrong in the pessimistic direction.
#
# The release notes must still say the build is unnotarized and must carry the xattr line,
# because a user who launches a quarantined app does not get a warning — macOS deletes it.
# docs/planning/notarization/runbook.md is what to execute the day a Developer ID exists.

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CI: "1"
  XCODE_MAJOR: "16"

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode ${{ env.XCODE_MAJOR }}.x
        run: |
          set -euo pipefail
          candidate="$(ls -d /Applications/Xcode_"$XCODE_MAJOR"*.app 2>/dev/null | sort -V | tail -1 || true)"
          if [ -z "$candidate" ]; then
            echo "::error::No Xcode $XCODE_MAJOR.x is installed on this runner. Found: $(ls -d /Applications/Xcode*.app 2>/dev/null | tr '\n' ' ')"
            echo "Refusing to fall back to the runner default: an unpinned toolchain means the next image update silently changes what CI measures."
            exit 1
          fi
          sudo xcode-select -s "$candidate/Contents/Developer"
          xcodebuild -version

      - name: Check signing secrets
        id: signing
        env:
          HAS_CERT: ${{ secrets.APPLE_CERT_P12_BASE64 }}
        run: |
          if [ -n "$HAS_CERT" ]; then echo "available=true" >> "$GITHUB_OUTPUT"; else echo "available=false" >> "$GITHUB_OUTPUT"; fi

      - name: Import Apple Development certificate
        if: steps.signing.outputs.available == 'true'
        env:
          P12: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
        run: |
          echo "$P12" | base64 -d > cert.p12
          security create-keychain -p vocca-ci vocca-ci.keychain-db
          security set-keychain-settings -lut 21600 vocca-ci.keychain-db
          security unlock-keychain -p vocca-ci vocca-ci.keychain-db
          security import cert.p12 -k vocca-ci.keychain-db -P "$P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k vocca-ci vocca-ci.keychain-db
          security default-keychain -s vocca-ci.keychain-db
          security list-keychains -d user -s vocca-ci.keychain-db
          security find-identity -v -p codesigning

      # The same gate every other CI path runs, never a bare `swift test` (it exits 0 when
      # it discovers nothing). A release is not a place for the suite to skip quietly.
      - name: Run the suite (with a test-count floor)
        run: ./Scripts/test-with-floor.sh

      - name: Build Vocca.app (Release)
        run: |
          set -euo pipefail
          # ARCHS=arm64 on the build request, for the reason ci.yml states: the setting has to be
          # here to reach the SPM dependencies' generated projects, and Vocca ships Apple-Silicon-only.
          xcodebuild -project Vocca.xcodeproj -scheme Vocca -configuration Release \
            -derivedDataPath .build/xcode-release ARCHS=arm64 build

      - name: Sign with the imported identity
        if: steps.signing.outputs.available == 'true'
        run: |
          set -euo pipefail
          identity="$(security find-identity -v -p codesigning | sed -n 's/.*"\([^"]*\)".*/\1/p' | head -1)"
          [ -n "$identity" ] || { echo "::error::No codesigning identity found in the imported keychain."; exit 1; }
          VOCCA_DEV_IDENTITY_NAME="$identity" ./Scripts/sign.sh \
            .build/xcode-release/Build/Products/Release/Vocca.app

      - name: Refuse to release unsigned
        if: steps.signing.outputs.available == 'false'
        run: |
          echo "::error::This tag push has no signing secrets (APPLE_CERT_P12_BASE64 + APPLE_CERT_PASSWORD), so the Release bundle is ad-hoc signed and useless outside this runner. A green run must produce a release; configure the secrets and re-tag, or this run ends red on purpose."
          exit 1

      - name: Verify the tag matches the bundle version
        run: |
          set -euo pipefail
          app=".build/xcode-release/Build/Products/Release/Vocca.app"
          bundle_version="$(plutil -extract CFBundleShortVersionString raw -o - "$app/Contents/Info.plist")"
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$bundle_version" != "$tag_version" ]; then
            echo "::error::Tag v$tag_version but the bundle reports $bundle_version. Bump CFBundleShortVersionString in App/Info.plist (and keep Vocca.xcodeproj's MARKETING_VERSION in sync) before tagging — the installed app must report the released version."
            exit 1
          fi
          echo "Bundle CFBundleShortVersionString $bundle_version matches tag ${GITHUB_REF_NAME}."

      # The bundle contract suite, run against the signed Release bundle this tag ships —
      # the same assertions ci.yml runs on every PR, now on the artifact that is about to
      # become a release: microphone entitlement present, get-task-allow absent, hardened
      # runtime in the signature, icon present.
      - name: Run the suite against the signed bundle
        env:
          VOCCA_APP_BUNDLE: .build/xcode-release/Build/Products/Release/Vocca.app
          VOCCA_EXPECTED_CONFIGURATION: Release
        run: ./Scripts/test-with-floor.sh

      # A DMG, not a zip, and the reason is measured rather than stylistic. `zip -r` FOLLOWS
      # symlinks, and whisper.framework is a versioned framework built out of them
      # (Versions/Current -> A, and the framework-root `whisper` -> Versions/Current/whisper).
      # v0.1.0 shipped that way: the 5.7 MB binary was stored three times, Versions/Current came
      # out of the archive as a real directory, and `codesign --verify --deep --strict` on the
      # extracted bundle failed with "bundle format is ambiguous (could be app or framework)".
      # That release cannot launch on any Mac — Gatekeeper never gets a say — and it would fail
      # notarization later for the same reason. `hdiutil` over a staging folder preserves the
      # links (as `ditto -c -k --keepParent` would for a zip); `cp -R` into the staging folder
      # does too. Do not reintroduce `zip` here.
      - name: Package Vocca.dmg
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          cd .build/xcode-release/Build/Products/Release

          # The staging folder holds the app next to an /Applications symlink, so the mounted
          # volume is the usual drag-to-install window.
          rm -rf dmg-stage && mkdir dmg-stage
          cp -R Vocca.app dmg-stage/
          ln -s /Applications dmg-stage/Applications
          hdiutil create -volname Vocca -srcfolder dmg-stage -ov \
            -format UDZO -fs HFS+ "Vocca-${VERSION}.dmg"
          rm -rf dmg-stage

          # Signing the DMG is cosmetic while the app carries an Apple Development identity
          # (Gatekeeper quarantines the download either way), but it is the line that starts
          # mattering the day this switches to Developer ID + notarytool — see
          # docs/planning/notarization/runbook.md step 3.
          identity="$(security find-identity -v -p codesigning | sed -n 's/.*"\([^"]*\)".*/\1/p' | head -1)"
          codesign --force --sign "$identity" --timestamp "Vocca-${VERSION}.dmg" \
            || echo "::warning::DMG signing failed; shipping it unsigned"

          # Checksums last, so they cover the final bytes of the artifact that ships.
          shasum -a 256 "Vocca-${VERSION}.dmg" > SHA256SUMS.txt
          cat SHA256SUMS.txt

          # The archive symlink check, on the artifact this tag is about to publish. v0.1.0 is
          # why this is a gate and not a comment: nothing in the suite reaches the packaging
          # step, so a broken archive was publishable and green.
          hdiutil attach -nobrowse -readonly -mountpoint dmg-check "Vocca-${VERSION}.dmg"
          trap 'hdiutil detach dmg-check -quiet || true' EXIT
          [ -L dmg-check/Vocca.app/Contents/Frameworks/whisper.framework/Versions/Current ] || {
            echo "::error::whisper.framework/Versions/Current is not a symlink inside the DMG. The archive step flattened the framework — the published app will not pass codesign --verify. This is the v0.1.0 zip defect; do not ship."
            exit 1
          }
          codesign --verify --deep --strict --verbose=2 dmg-check/Vocca.app
          echo "DMG contents verify: framework links intact, signature seals."

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          cd .build/xcode-release/Build/Products/Release
          # The heredoc body carries the block scalar's indentation; strip it so the release
          # notes render as markdown rather than one code block.
          sed 's/^ \{10\}//' > notes.md <<'NOTES'
          ## Install

          Download `Vocca-VERSION_PLACEHOLDER.dmg`, open it, drag **Vocca** to Applications.
          Then clear the quarantine flag **before you open it the first time**:

          ```bash
          xattr -dr com.apple.quarantine /Applications/Vocca.app
          open /Applications/Vocca.app
          ```

          Vocca is signed with an Apple Development certificate (hardened runtime, secure
          timestamp) and is **not notarized**, so macOS quarantines it on download. There is no
          device restriction — the bundle carries no provisioning profile and its only
          entitlement is microphone access — so Gatekeeper is the sole obstacle, and the command
          above is what removes it. On macOS 15 the old Control-click -> Open shortcut is gone;
          it is that command or System Settings -> Privacy & Security -> **Open Anyway** after a
          blocked launch.

          Run the `xattr` line first. Opening a quarantined app does not merely warn — macOS
          **deletes** it, and not to the Trash.

          Vocca is `LSUIElement`: it has no Dock icon and no window at launch. Look for the menu
          bar item.

          Verify the download against `SHA256SUMS.txt`.

          ---

          **This build has dictated on a real machine.** A founder-run pass covered
          `docs/SMOKE_CHECKLIST.md` steps 62-68, but the injection matrix, the latency gate, and
          notarization are still unmeasured or pending — no numbers are published yet. Treat this
          as a look at what is possible, with those numbers still pending.
          NOTES
          sed -i '' "s/VERSION_PLACEHOLDER/${VERSION}/g" notes.md

          gh release create "$GITHUB_REF_NAME" \
            "Vocca-${VERSION}.dmg" SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --notes-file notes.md
